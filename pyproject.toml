[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observe-search"
version = "1.0.0"
description = "OBSERVE - local semantic code search: desktop app, CLI, and MCP server. Nothing leaves your machine."
readme = "OBSERVE.md"
license = { text = "MIT" }
authors = [{ name = "Gavin Branaa", email = "gbranaa4@gmail.com" }]
requires-python = ">=3.10"
keywords = ["code search", "semantic search", "mcp", "embeddings", "ternary", "local-first", "privacy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "sentence-transformers",
    "faiss-cpu",
    "flask",
    "torch",
    "mcp",
    "tiktoken",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/tritsystem/012-trit-search"
Documentation = "https://github.com/tritsystem/012-trit-search/blob/main/OBSERVE.md"
Repository = "https://github.com/tritsystem/012-trit-search"
Issues = "https://github.com/tritsystem/012-trit-search/issues"
Changelog = "https://github.com/tritsystem/012-trit-search/blob/main/CHANGELOG.md"

[project.scripts]
observe = "trit_app:main"
observe-search = "trit_search:main"
observe-mcp = "trit_mcp_server:main"
observe-demo = "observe_demo:main"

[tool.setuptools]
# The repo is a research monorepo; the product is exactly these modules.
# observe_pipeline is a runtime dependency of trit_app (lazy-imported for
# project grouping) -- it MUST ship or the app crashes on that code path.
py-modules = ["trit_app", "trit_search", "trit_mcp_server", "observe_demo", "observe_pipeline"]
