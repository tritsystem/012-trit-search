name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (product + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Product modules import
        run: |
          python -c "import trit_search, trit_mcp_server, observe_demo; print('product import OK')"

      - name: CLI entry points respond
        run: |
          observe-search --help
          observe-mcp --help || true

      - name: Unit tests
        run: |
          python -m pytest -q test_decision_arbitration.py test_ternary_qwen.py

      - name: Lint (non-blocking)
        run: |
          pip install ruff
          ruff check . || true
